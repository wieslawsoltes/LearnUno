name: Finalize reviewed inline lesson
on:
  push:
    branches: [feat/common-control-contracts]
    paths: [scripts/finalize-inline-lesson.mjs, .github/workflows/finalize-inline-lesson.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/common-control-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-inline-lesson.mjs
      - run: npm ci
      - run: npm test
      - name: Commit only the three reviewed source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/src/learning/interface-patterns/common-controls.mjs site/src/learning/interface-patterns/app.mjs site/design/common-controls.css
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix: use supported Uno inlines and distinguish the RichTextBlock project example'
          git push origin HEAD:feat/common-control-contracts
