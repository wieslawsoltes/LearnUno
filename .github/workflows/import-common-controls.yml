name: Import reviewed common-control lessons
on:
  push:
    branches: [feat/common-control-contracts]
    paths: ['.github/workflows/import-common-controls.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'wieslawsoltes/LearnUno'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/common-control-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover the exact reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98e75d66b2c7b60de612a873921a152daf065394 HEAD
          : > /tmp/common-controls.patch.gz
          for blob in f42c79881d145f56e09c4b4276a35fa123adc18b 66af519c3cbe859f23d9a12be864711730da2924 3bb8e08562b86ec87401399e46866cf9608d94fd; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> /tmp/common-controls.patch.gz
          done
          echo '5a3bc6002337dfb90cc27f5e0a856f3ca6d73c484d2d4fad236426af98f5be59  /tmp/common-controls.patch.gz' | sha256sum -c -
          gzip -dc /tmp/common-controls.patch.gz > /tmp/common-controls.patch
          echo '526b1d81fed4fe01bd6109ed4260f2087dd385d0b6d7baf878a4312aa1c71891  /tmp/common-controls.patch' | sha256sum -c -
          git apply --check --unidiff-zero /tmp/common-controls.patch
          git apply --index --unidiff-zero /tmp/common-controls.patch
          python - <<'PY'
          import subprocess
          expected = {
            'site/src/learning/interface-patterns/common-controls.mjs',
            'site/src/learning/interface-patterns/common-models.mjs',
            'site/src/learning/interface-patterns/common-mockups.mjs',
            'site/design/common-controls.css', 'site/content/control-study.json',
            'scripts/control-study.mjs', 'tests/common-controls.test.mjs',
            'tests/browser/common-controls.spec.mjs', 'docs/common-controls.md',
            'site/src/learning/interface-patterns/lessons.mjs',
            'site/src/learning/interface-patterns/app.mjs', 'site/visual.css',
            'scripts/build.mjs', 'tests/interface-patterns.test.mjs'
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected: raise SystemExit('Unexpected patch paths: ' + repr(actual ^ expected))
          PY
      - run: npm ci
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: unoplatform/uno
          ref: e1292e0d87f9d38c9f3a120c69f0200b3c0999c1
          path: .sources/uno
          sparse-checkout: |
            doc
            src
          persist-credentials: false
      - run: npm run build
        env:
          REQUIRE_SOURCES: '1'
      - name: Commit only the verified fourteen source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: add source-backed UserControl, rich text, GridView and NumberBox lessons'
          git push origin HEAD:feat/common-control-contracts
