name: Apply verified Fluent focus refinements
on:
  push:
    branches: [design/fluent-learning-shell]
    paths: ['.github/workflows/import-fluent-focus.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'wieslawsoltes/LearnUno'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/fluent-learning-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the exact preserved twelve-path patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f14d99394773094ea16dcdb7f2ee9040b8d834de HEAD
          : > /tmp/fluent-focus.gz
          for blob in b1ccde4e7a29ae4fb6951d880c0f574bd937b6d0 d3c35f46aac8d7825b8943ed78d1b9d626ce508d 0041ebb5a667b278c578d589b8360e1111a96d56 ab7e69b216334b4d1509466c5f5f12907ca395d4; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> /tmp/fluent-focus.gz
          done
          echo '07464e9585620377c86d6efa5b248cfe174595ad981def74280f831cfad4f5a5  /tmp/fluent-focus.gz' | sha256sum -c -
          gzip -dc /tmp/fluent-focus.gz > /tmp/fluent-focus.patch
          echo '8e3c65205e17a9dc6579afe74fa6b3e832a774d8ca049be59e4d4a7ae2b149a2  /tmp/fluent-focus.patch' | sha256sum -c -
          git apply --check /tmp/fluent-focus.patch
          git apply --index /tmp/fluent-focus.patch
          python - <<'PY'
          import subprocess
          expected = set('''.github/workflows/finalize-fluent-input.yml
          docs/fluent-ci-refinement.md
          docs/fluent-learning-shell.md
          site/src/app.mjs
          site/src/presentation/chapter-navigation.mjs
          site/src/presentation/workspace-panes.mjs
          site/src/workspace.mjs
          tests/browser/common-controls.spec.mjs
          tests/browser/fluent.spec.mjs
          tests/browser/presentation-components.spec.mjs
          tests/browser/workspace-driver.mjs
          tests/presentation.test.mjs'''.split())
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected: raise SystemExit('Unexpected patch paths: ' + repr(actual ^ expected))
          print('Verified the preserved patch and all twelve paths.')
          PY
          # The connector will delete both obsolete transfer workflows afterwards.
          # This job deliberately commits source only, within contents permission.
          git restore --source=HEAD --staged --worktree .github/workflows/finalize-fluent-input.yml
      - run: npm ci
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: unoplatform/uno
          ref: e1292e0d87f9d38c9f3a120c69f0200b3c0999c1
          path: .sources/uno
          sparse-checkout: |
            doc
            src
          persist-credentials: false
      - run: npm run build
        env:
          REQUIRE_SOURCES: '1'
      - name: Commit only validated source refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix: retain mobile focus, present compiler failures and synchronize chapter navigation'
          git push origin HEAD:design/fluent-learning-shell
