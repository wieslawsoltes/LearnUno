name: Import verified Fluent learning shell
on:
  push:
    branches: [design/fluent-learning-shell]
    paths: ['.github/workflows/import-fluent-shell.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'wieslawsoltes/LearnUno'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/fluent-learning-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover the reviewed theme and pending regression guards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 677d056e4acabbd52e4f4870b74c279409278585 HEAD
          : > /tmp/fluent.patch.xz
          for blob in cae72dc6384833ec1309b7f48f4a36d868dde0e4 3f0c0bf61d447797b020e7f692c3c4f00746fb38 d608c9e84d8d8a2f20f79a0996aaf392d8c7c6fd; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> /tmp/fluent.patch.xz
          done
          echo '44f678624fe03f48a749226ecdd2968d2133294c6dfec710d0e7d1ded8109487  /tmp/fluent.patch.xz' | sha256sum -c -
          xz -dc /tmp/fluent.patch.xz > /tmp/fluent.patch
          echo 'a28839bb567db22ad543da590dd48f4de650cc088f0bce5d696d6d5a2614cad6  /tmp/fluent.patch' | sha256sum -c -
          git apply --check --unidiff-zero /tmp/fluent.patch
          git apply --index --unidiff-zero /tmp/fluent.patch
          python - <<'PY'
          import subprocess
          expected = set('''docs/fluent-learning-shell.md
          docs/rich-text-regression-guards.md
          site/content/control-study.json
          site/design/common-controls.css
          site/design/fluent-mobile.css
          site/design/fluent-reading.css
          site/design/fluent-surfaces.css
          site/design/fluent.css
          site/favicon.svg
          site/index.html
          site/src/app.mjs
          site/src/atlas/home.mjs
          site/src/helpers.mjs
          site/src/learning/chapters.mjs
          site/src/learning/interface-patterns/app.mjs
          site/src/learning/interface-patterns/common-controls.mjs
          site/src/learning/interface-patterns/rich-text-contract.mjs
          site/src/learning/interface-patterns/runtime-contract-view.mjs
          site/src/presentation/chapter-navigation.mjs
          site/src/presentation/navigation.mjs
          site/src/presentation/preferences.mjs
          site/src/presentation/workspace-panes.mjs
          site/src/workspace.mjs
          tests/browser/app-building.spec.mjs
          tests/browser/common-controls.spec.mjs
          tests/browser/fluent.spec.mjs
          tests/browser/interface-patterns.spec.mjs
          tests/browser/rich-text-contract.mjs
          tests/browser/runtime-contract.spec.mjs
          tests/browser/study.spec.mjs
          tests/presentation.test.mjs
          tests/rich-text-contract.test.mjs'''.split())
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected: raise SystemExit('Unexpected patch paths: ' + repr(actual ^ expected))
          print(f'Verified {len(actual)} source paths')
          PY
      - run: npm ci
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: unoplatform/uno
          ref: e1292e0d87f9d38c9f3a120c69f0200b3c0999c1
          path: .sources/uno
          sparse-checkout: |
            doc
            src
          persist-credentials: false
      - run: npm run build
        env:
          REQUIRE_SOURCES: '1'
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: add restrained Fluent materials, compact reading and accessible mobile navigation'
          git push origin HEAD:design/fluent-learning-shell
