name: Inline input diagnosis
on:
  push:
    branches: [design/fluent-learning-shell]
    paths: ['tests/diagnostics/**', 'scripts/adapt-inline-input.mjs', '.github/workflows/inline-diagnostics.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: artifacts/runtime
          key: uno-browser-v2-${{ hashFiles('global.json', 'runtime/*.csproj', 'runtime/*.cs', 'runtime/WasmScripts/**') }}
      - if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          dotnet workload install wasm-tools
          dotnet publish runtime/LearnUnoRunner.csproj -f net10.0-browserwasm -c Release -o artifacts/runtime
      - run: npm run build
        env:
          REQUIRE_RUNTIME: '1'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/diagnostics/playwright.config.mjs
      - name: Apply only the proven source adaptation
        run: |
          node scripts/adapt-inline-input.mjs
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/src/learning/interface-patterns/common-controls.mjs tests/browser/common-controls.spec.mjs
          git commit -m 'fix: enable native inline tab navigation and managed Enter activation'
          git push origin HEAD:design/fluent-learning-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-diagnosis
          path: artifacts/inline
          retention-days: 3
