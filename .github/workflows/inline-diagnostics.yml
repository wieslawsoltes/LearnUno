name: Inline input diagnosis
on:
  push:
    branches: [design/fluent-learning-shell]
    paths: ['tests/diagnostics/**', '.github/workflows/inline-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: artifacts/runtime
          key: uno-browser-v2-${{ hashFiles('global.json', 'runtime/*.csproj', 'runtime/*.cs', 'runtime/WasmScripts/**') }}
      - if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          dotnet workload install wasm-tools
          dotnet publish runtime/LearnUnoRunner.csproj -f net10.0-browserwasm -c Release -o artifacts/runtime
      - run: npm run build
        env:
          REQUIRE_RUNTIME: '1'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/diagnostics/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-diagnosis
          path: artifacts/inline
          retention-days: 3
