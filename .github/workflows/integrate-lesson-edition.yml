name: Integrate reviewed lesson edition
on:
  push:
    branches: [feat/lesson-specific-atlas]
    paths: ['.delivery/**', '.github/workflows/integrate-lesson-edition.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lesson-specific-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and unpack the reviewed source-only delivery
        run: |
          cat .delivery/part0 .delivery/part1 .delivery/part2 .delivery/part3 .delivery/part4 > /tmp/lesson-source.tar.xz
          echo 'caa89a376ca8206a48ae64da0db9ea93860e6d480f5442918b1dda2f292d6d3d  /tmp/lesson-source.tar.xz' | sha256sum --check
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open('/tmp/lesson-source.tar.xz', 'r:xz') as archive:
              entries = archive.getmembers()
              assert len(entries) == 24
              assert sum(entry.size for entry in entries) < 1_000_000
              for entry in entries:
                  path = PurePosixPath(entry.name)
                  assert entry.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert entry.name.startswith(('site/', 'tests/')) or entry.name in {'.delivery/integrate.py', 'docs/lesson-specific-atlas.md'}
              archive.extractall('.', filter='data')
          PY
      - run: python .delivery/integrate.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit ordinary source only and remove the delivery pieces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .delivery/part0 .delivery/part1 .delivery/part2 .delivery/part3 .delivery/part4
          rm .delivery/integrate.py
          git add site scripts/build.mjs tests docs/lesson-specific-atlas.md
          git diff --cached --stat
          git commit -m 'feat: add sixty lesson-specific experiments, deeper fundamentals and site-wide code coloring'
          git push origin HEAD:feat/lesson-specific-atlas
