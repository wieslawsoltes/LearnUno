name: Integrate visual edition
on:
  push:
    branches: [design/visual-edition]
    paths: ['scripts/integrate-visual-edition.mjs', '.github/workflows/integrate-visual-edition.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/LearnUno'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/visual-edition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/integrate-visual-edition.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit source only; workflow changes are handled separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/studio.yml
          git add site/src/app.mjs site/src/atlas/lab.mjs site/index.html scripts/build.mjs tests/browser/studio.spec.mjs tests/browser/webgpu.spec.mjs README.md
          git diff --cached --stat
          git commit -m 'feat: integrate visual atlas routes, editorial design and regression coverage'
          git push origin HEAD:design/visual-edition
