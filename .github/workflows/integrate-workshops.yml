name: Integrate reviewed workshops
on:
  push:
    branches: [feat/learning-refinement]
    paths: ['.github/workflows/integrate-workshops.yml']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/LearnUno' && github.ref == 'refs/heads/feat/learning-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and validate reviewed source before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          parts=[('cd0ce923e120d51bfb369a94a423b08fe9e5997b',12000),('71cf9084048167fcb015b8303acf5b73bc7c9a68',12000),('0d177537ef93ff81491518da5a54cb3002a988dd',12000),('8c26a252900d8a5d29cd2471063c346e41db92b5',12000),('2fd42caa14a174deca5aa3434ffa8ca8a94e5766',12000),('426981a5a81d8e4f9e61997a0b66de24a29a722a',808)]
          archive=bytearray()
          for sha,size in parts:
              request=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/LearnUno/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert len(data)==size and hashlib.sha1(('blob '+str(size)+'\0').encode()+data).hexdigest()==sha, 'Git blob mismatch'
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest()=='a1a851afacc62aacad76fa6adc5246f20e38db686e9b7a904f3f6283085d2b67', 'Archive mismatch'
          decoded=lzma.decompress(archive)
          assert len(decoded)==250001, 'Unexpected source payload size'
          payload=json.loads(decoded)
          assert payload['version']==1 and len(payload['files'])==24, 'Unexpected source manifest'
          root=pathlib.Path.cwd().resolve(); staged={}
          for entry in payload['files']:
              name=entry['path']; path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and name not in staged
              assert name=='README.md' or path.parts[0] in ('site','scripts','docs','tests'), 'Unexpected source path'
              target=root.joinpath(*path.parts)
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              if entry['baseSha256'] is None:
                  assert not target.exists(), 'New source already exists: '+name
                  text=entry['content']
              else:
                  before=target.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==entry['baseSha256'], 'Baseline changed: '+name
                  text=before.decode('utf-8'); edits=entry['edits']; end=0
                  for start,finish,replacement in edits:
                      assert end<=start<=finish<=len(text) and isinstance(replacement,str)
                      end=finish
                  for start,finish,replacement in reversed(edits): text=text[:start]+replacement+text[finish:]
              data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==entry['sha256'], 'Result mismatch: '+name
              staged[name]=data
          for name,data in staged.items():
              target=root/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          subprocess.run(['git','add','--',*staged],check=True)
          print('Validated and staged all 24 source files.')
          PY
      - run: npm ci
      - run: npm test
      - name: Commit source on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add data workshops, design mockups and a pinned feature coverage map'
          git push origin HEAD:feat/learning-refinement
      - name: Validate expanded runtime matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/learning-refinement
