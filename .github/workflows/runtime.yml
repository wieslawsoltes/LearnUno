name: Runtime validation
on:
  push:
    paths: ['runtime/**', 'global.json', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['runtime/**', 'global.json', '.github/workflows/runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - run: dotnet publish runtime/LearnUnoRunner.csproj -f net10.0-browserwasm -c Release -o artifacts/runtime
      - name: Require actual WebAssembly output
        run: |
          find artifacts/runtime -name embedded.js -o -name dotnet.js -o -name '*.wasm'
          test -n "$(find artifacts/runtime -name embedded.js -print -quit)"
          test -n "$(find artifacts/runtime -name '*.wasm' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-runtime
          path: artifacts/runtime
          retention-days: 7
