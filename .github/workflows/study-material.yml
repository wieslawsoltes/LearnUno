name: Assemble pinned lesson research material
on:
  push:
    branches: [feat/source-connected-lessons]
    paths: ['.github/workflows/study-material.yml']
permissions:
  contents: read
jobs:
  material:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: unoplatform/uno
          ref: e1292e0d87f9d38c9f3a120c69f0200b3c0999c1
          path: .sources/uno
          sparse-checkout: |
            doc
            src
          persist-credentials: false
      - name: Package text-only primary material and locked dependencies
        run: |
          mkdir -p artifacts
          find .sources/uno -type f \( -name '*.cs' -o -name '*.xaml' -o -name '*.md' -o -name '*.yml' -o -name 'LICENSE' -o -name 'NOTICE' \) -not -path '*/.git/*' -print0 | tar --null -T - -czf artifacts/uno-primary-material.tar.gz
          tar -czf artifacts/locked-devtools.tar.gz node_modules package.json package-lock.json global.json sources.lock.json playwright.config.mjs LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-study-material
          path: artifacts/*.tar.gz
          retention-days: 3
